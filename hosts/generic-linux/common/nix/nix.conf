# System-wide Nix daemon settings. Deployed to /etc/nix/nix.conf by
# bin/install-etc.sh. Client-side (~/.config/nix/nix.conf) is ignored for
# daemon-side options unless the user is in trusted-users.

experimental-features = nix-command flakes

# Hardlink identical files in the store as they are added.
# Daemon-side only; has no effect in the user nix.conf.
auto-optimise-store = true

trusted-users = root yuki

# Suppress the "Git tree is dirty" warning during local iteration.
warn-dirty = false

max-jobs = auto
cores = 0
