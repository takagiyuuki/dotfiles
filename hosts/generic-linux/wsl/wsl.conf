# Per-distro WSL settings. Deployed to /etc/wsl.conf by bin/install-etc.sh.
# Requires `wsl.exe --shutdown` from Windows to take effect.
# Only full-line comments are supported.

[boot]
systemd = true

[user]
default = yuki

[automount]
enabled = true
mountFsTab = true
# metadata enables chmod/chown on /mnt/c; without it git reports
# every Windows-side file as mode 0777 and permanently modified.
options = "metadata,umask=22,fmask=11"

[interop]
enabled = true
# Keep the Linux PATH clean. Windows executables stay reachable by
# absolute path (/mnt/c/...), but `code`, `explorer.exe` and `clip.exe`
# will no longer resolve. Set to true if that becomes a problem.
appendWindowsPath = false

[network]
hostname = dev
generateHosts = true
generateResolvConf = true
